<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>delonix — Enterprise Billing Console</title>
<meta name="description" content="delonix — a simple, sustainable, scalable enterprise billing system: subscriptions, usage metering, invoicing, dunning, revenue recognition and tax." />
<link rel="stylesheet" href="billing.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 48'><path d='M20 44 C20 44 6 34 8 20 C9 12 16 6 22 4 C18 14 14 24 17 34 C18 38 20 41 23 44 Z' fill='white'/><path d='M23 44 C23 44 34 32 30 18 C28 10 20 5 14 4 C19 14 24 24 23 34 C22 39 21 41 19 44 Z' fill='%23ff5a1f'/></svg>">
</head>
<body>


<!-- ============ SPLASH / LOGIN ============ -->
<div id="splash">
  <div class="splash-card">
    <svg class="splash-logo" viewBox="0 0 380 90" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="delonix">
      <path d="M26 74 C26 74 16 56 20 38 C22 27 32 18 40 16 C35 29 30 44 34 58 C36 65 41 69 46 74 Z" fill="#ff5a1f" opacity="0.92"/>
      <path d="M46 74 C46 74 54 56 48 38 C45 27 36 19 28 17 C35 30 42 44 40 58 C38 66 36 69 34 74 Z" fill="#bf3d10" opacity="0.72"/>
      <text x="9" y="76" font-family="'Bricolage','Georgia',serif" font-size="70" font-weight="700" fill="#ff5a1f" letter-spacing="-2">d</text>
      <text x="60" y="76" font-family="'Bricolage','Georgia',serif" font-size="70" font-weight="700" fill="#f7f2ea" letter-spacing="-2">elonix</text>
    </svg>
    <form class="splash-form" id="loginForm">
      <label for="email">Work email</label>
      <input id="email" type="email" value="abukhari@rentsync.com" autocomplete="username" />
      <label for="pw">Password</label>
      <input id="pw" type="password" value="••••••••••" autocomplete="current-password" />
      <button class="enter-btn" type="button" data-act="enter">Enter console →</button>
      <div class="splash-or"><span>or</span></div>
      <button class="sso-btn" type="button" data-act="enter">Continue with SSO · SAML</button>
    </form>
    <div class="splash-meta">
      <span><i class="dotg"></i> All systems operational</span>
      <span>SOC 2 Type II</span>
      <span>v4.8 · prod</span>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <!-- sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 48" class="brand-mark" role="img" aria-label="delonix emblem" width="32" height="38">
        <path d="M20 44 C20 44 6 34 8 20 C9 12 16 6 22 4 C18 14 14 24 17 34 C18 38 20 41 23 44 Z" fill="white"/>
        <path d="M23 44 C23 44 34 32 30 18 C28 10 20 5 14 4 C19 14 24 24 23 34 C22 39 21 41 19 44 Z" class="brand-accent" fill="var(--ember)"/>
      </svg>
      <div class="name"><b>del</b>onix</div>
      <div class="env">Prod</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sb-foot">
      <div class="avatar">AB</div>
      <div class="who"><b>Amir Bukhari</b><br><span>Revenue Operations</span></div>
      <button class="icon-btn" style="margin-left:auto;width:30px;height:30px" title="Sign out" data-act="signout">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </aside>

  <!-- main -->
  <div class="main">
    <header class="topbar">
      <div class="crumbs">delonix / <b id="crumb">Dashboard</b></div>
      <div class="search">
        <svg class="si" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="cmdInput" placeholder="Jump to… accounts, invoices, close, controls  ⌘K" autocomplete="off" />
        <div class="cmd-menu" id="cmdMenu"></div>
      </div>
      <div class="spacer"></div>
      <div class="pill-select ent" data-act="entityswitch"><span class="ent-dot"></span>Delonix Inc <b>North America</b><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div>
      <div class="pill-select">Currency <b>USD $</b>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="theme-btn" id="themeBtn" role="button" tabindex="0" title="Change theme">
        <span class="tdot" id="themeBtnDot" style="background:#ff5a1f"></span>
        <span id="themeBtnLabel">Ember</span>
        <div class="theme-popover" id="themePopover">
          <div class="theme-popover-section">Preset themes</div>
          <div id="tpList"></div>
          <div class="tp-divider"></div>
          <div class="theme-popover-section">Accent color</div>
          <div class="accent-row" id="accentRow"></div>
          <div class="tp-divider"></div>
          <div class="theme-popover-section">Data density</div>
          <div class="density-row" id="densityRow">
            <button class="d-btn" data-act="density" data-arg="compact">Compact</button>
            <button class="d-btn active" data-act="density" data-arg="default">Default</button>
            <button class="d-btn" data-act="density" data-arg="spacious">Spacious</button>
          </div>
        </div>
      </div>
      <button class="icon-btn" title="Notifications" data-act="notifications"><span class="dot"></span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      </button>
      <button class="btn primary" data-act="newinvoice">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Create
      </button>
    </header>
    <main id="view"></main>
  </div>
</div>

<!-- drawer -->
<div class="drawer-bg" id="drawerBg" data-act="close"></div>
<aside class="drawer" id="drawer"></aside>
<div class="toast" id="toast"><span class="dotg"></span><span id="toastMsg"></span></div>

<script src="js/utils.js"></script>
  <script src="js/data.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/views.js"></script>
  <script src="js/events.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/drawers.js"></script>

</body>
</html>
